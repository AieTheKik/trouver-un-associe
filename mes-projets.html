<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes projets — Trouver un Associé</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --c-red:#E11D2E;--c-red-deep:#C0142A;
  --c-navy:#1A1247;--c-navy-ink:#0E0830;
  --c-blue:#1F60E8;--c-blue-soft:#E6EEFC;
  --c-bg:#FBFAF7;--c-mute:#7A7A8E;
  --c-white:#FFFFFF;--c-border:rgba(14,8,48,.08);
  --violet:#1A1247;
  --f-display:'Sora',sans-serif;--f-body:'Inter',sans-serif;
  --radius:22px;
}
body{font-family:var(--f-body);background:var(--c-bg);color:var(--c-navy-ink);line-height:1.6;font-size:15px;overflow-x:hidden}

.util-bar{background:var(--c-navy);display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 0}
.util-bar span{font-family:var(--f-body);font-weight:600;font-size:11.5px;color:var(--c-white);text-transform:uppercase;letter-spacing:0.16em}
.util-bar .ub-sep{font-size:10px;color:rgba(255,255,255,.3)}
.util-bar .ub-link{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--c-white);text-decoration:none;letter-spacing:0.1em;opacity:.85;transition:opacity .2s}
.util-bar .ub-link:hover{opacity:1;text-decoration:underline}

nav{background:var(--c-white);border-radius:var(--radius);box-shadow:0 12px 32px rgba(14,8,48,.12);max-width:1240px;margin:12px auto 0;padding:0 28px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:12px;z-index:100}
.logo{text-decoration:none;display:flex;align-items:center;gap:10px}
.logo-bubble{width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-text{display:flex;flex-direction:column;line-height:1.2}
.logo-text .lt-main{font-family:var(--f-display);font-weight:400;font-size:15px;color:var(--c-navy-ink);letter-spacing:-0.012em}
.logo-text .lt-sub{font-family:var(--f-body);font-weight:500;font-size:9.5px;color:var(--c-mute);letter-spacing:0.04em}
.nav-r{display:flex;align-items:center;gap:20px;margin-left:auto}
.nav-link{font-family:var(--f-body);font-size:14px;font-weight:500;color:var(--c-mute);text-decoration:none;transition:color .2s}
.nav-link:hover{color:var(--c-navy-ink)}
.btn-secondary{background:var(--c-white);color:var(--c-navy-ink);padding:14px 26px;border-radius:999px;font-size:14px;font-weight:500;text-decoration:none;border:1.5px solid var(--c-navy-ink);font-family:var(--f-body);transition:all .2s}
.btn-secondary:hover{background:var(--c-navy-ink);color:var(--c-white)}
.btn-primary{background:var(--c-red);color:var(--c-white);padding:14px 26px;border-radius:999px;font-size:14px;font-weight:500;text-decoration:none;font-family:var(--f-body);transition:all .2s}
.btn-primary:hover{background:var(--c-red-deep)}

.hero-band{background:var(--c-red);padding:32px;margin-top:16px}
.hero-band-inner{max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.hero-band-left h1{font-family:var(--f-display);font-weight:300;font-size:26px;color:var(--c-white);letter-spacing:-0.012em;margin-bottom:4px}
.hero-band-left p{font-size:14px;color:rgba(255,255,255,.6)}
.hero-stats{display:flex;gap:32px}
.hstat{text-align:center}
.hstat-n{font-family:var(--f-display);font-weight:300;font-size:26px;color:var(--c-white);line-height:1}
.hstat-l{font-family:var(--f-body);font-size:12px;color:rgba(255,255,255,.5);margin-top:3px}

.breadcrumb{max-width:1240px;margin:16px auto 0;padding:0 16px;font-size:13px;color:var(--c-mute)}
.breadcrumb a{color:var(--c-mute);text-decoration:none}
.breadcrumb a:hover{color:var(--c-navy-ink)}
.breadcrumb .sep{margin:0 6px;color:var(--c-mute)}

.content{max-width:1240px;margin:24px auto 0;padding:0 16px 60px}
.cards-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}

.pcard{background:var(--c-white);border:1.5px solid var(--c-border);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:12px;transition:all .22s;text-decoration:none}
.pcard:hover{transform:translateY(-3px);border-color:var(--c-blue);box-shadow:0 8px 24px rgba(31,96,232,.1)}
.pcard-top{display:flex;align-items:center;justify-content:space-between}
.ptag{font-size:13.5px;font-weight:500;padding:8px 16px;border-radius:999px;background:var(--c-white);border:1.5px solid var(--c-blue);color:var(--c-blue);font-family:var(--f-body)}
.pcard-title{font-family:var(--f-body);font-weight:500;font-size:15px;color:var(--c-navy-ink);letter-spacing:-0.01em;line-height:1.25}
.pcard-desc{font-size:13px;color:var(--c-mute);line-height:1.6;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard-chips{display:flex;flex-wrap:wrap;gap:5px}
.pchip{font-size:11px;padding:4px 10px;border-radius:999px;background:var(--c-blue-soft);color:var(--c-navy-ink);font-weight:500;font-family:var(--f-body)}
.pcard-footer{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1.5px solid var(--c-border)}
.pcard-meta{display:flex;align-items:center;gap:10px}
.pcard-loc{font-size:12px;color:var(--c-mute);display:flex;align-items:center;gap:4px}
.pcard-stage{font-size:11px;color:var(--c-mute);background:var(--c-bg);padding:3px 8px;border-radius:999px;font-weight:500}
.btn-edit{font-size:12px;font-weight:600;color:var(--c-white);background:var(--c-navy);padding:7px 14px;border-radius:999px;white-space:nowrap;font-family:var(--f-body);text-decoration:none;transition:background .2s}
.btn-edit:hover{background:var(--c-navy-ink)}

.loading{text-align:center;padding:60px 20px;color:var(--c-mute);grid-column:1/-1}
.loading-spinner{width:36px;height:36px;border:3px solid var(--c-border);border-top-color:var(--c-red);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

.empty{text-align:center;padding:80px 20px}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:.4}
.empty-title{font-family:var(--f-body);font-weight:600;font-size:18px;color:var(--c-navy-ink);margin-bottom:8px}
.empty-sub{font-size:14px;color:var(--c-mute);margin-bottom:24px}
.empty-cta{display:inline-flex;align-items:center;gap:8px;background:var(--c-red);color:var(--c-white);padding:14px 28px;border-radius:999px;font-size:14px;font-weight:600;text-decoration:none;font-family:var(--f-body);transition:background .2s}
.empty-cta:hover{background:var(--c-red-deep)}

@media(max-width:1100px){.cards-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){
  .cards-grid{grid-template-columns:1fr}
  .hero-stats{display:none}
  nav{margin:8px 12px 0;padding:0 16px}
  .nav-link,.btn-secondary{display:none}
  .hero-band{padding:24px 16px}
  .breadcrumb{padding:0 12px}
}
</style>
</head>
<body>

<div class="util-bar"><span>French Tech Bordeaux</span><span class="ub-sep">&middot;</span><a href="https://www.frenchtechbordeaux.com/adhesion" target="_blank" rel="noopener" class="ub-link">Adh&eacute;rer &rarr;</a></div>

<nav>
  <a href="index.html" class="logo">
    <div class="logo-bubble"><svg width="36" height="36" viewBox="0 0 80 80" fill="none"><rect width="80" height="80" rx="20" fill="#0E0830"/><circle cx="28" cy="32" r="9" fill="#E11D2E"/><circle cx="52" cy="32" r="9" fill="#1F60E8"/><path d="M18 56C18 50 22 46 28 46C32 46 35 48.5 40 48.5C45 48.5 48 46 52 46C58 46 62 50 62 56" stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none"/><path d="M37 56H43" stroke="#E11D2E" stroke-width="3.5" stroke-linecap="round"/></svg></div>
    <div class="logo-text">
      <span class="lt-main">trouver un associ&eacute;</span>
      <span class="lt-sub">BY FRENCH TECH BORDEAUX</span>
    </div>
  </a>
  <div class="nav-r">
    <a href="index.html" class="nav-link">Accueil</a>
    <a href="profils.html" class="nav-link">Profils</a>
    <a href="auth.html?redirect=/deposer.html" class="btn-secondary">+ D&eacute;poser un projet</a>
    <a href="auth.html" class="btn-primary" id="navAuthBtn">Se connecter</a>
    <a href="#" id="navLogoutBtn" style="display:none;font-size:13px;color:var(--c-mute);text-decoration:none">D&eacute;connexion</a>
  </div>
</nav>

<div class="hero-band">
  <div class="hero-band-inner">
    <div class="hero-band-left">
      <h1>Mes projets</h1>
      <p>G&egrave;re et modifie tes projets en quelques clics.</p>
    </div>
    <div class="hero-stats">
      <div class="hstat"><div class="hstat-n" id="countProjets">&mdash;</div><div class="hstat-l">Projets publi&eacute;s</div></div>
    </div>
  </div>
</div>

<div class="breadcrumb">
  <a href="index.html">Accueil</a><span class="sep">&gt;</span><span>Mes projets</span>
</div>

<div class="content">
  <div class="cards-grid" id="cardsGrid">
    <div class="loading">
      <div class="loading-spinner"></div>
      Chargement...
    </div>
  </div>
</div>

<script>
const { createClient } = supabase;
const sb = createClient(
  'https://rdyrlculowoqtixgdumc.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkeXJsY3Vsb3dvcXRpeGdkdW1jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3Njc3OTcsImV4cCI6MjA5MTM0Mzc5N30.RANwu2ouv0cn3G-UXxaxgEWD_GZFw7apogJg35vb_qo'
);

const tagStyles = [
  {bg:'#E6EEFC',color:'#1F60E8'},
  {bg:'#E6EEFC',color:'#1A1247'},
  {bg:'#E6EEFC',color:'#0E0830'}
];

function buildCard(projet, index) {
  const tag = tagStyles[index % tagStyles.length];
  const chips = (projet.profils_recherches||[]).slice(0,3).map(c=>'<span class="pchip">'+c+'</span>').join('');
  return '<div class="pcard">' +
    '<div class="pcard-top">' +
      '<span class="ptag" style="background:'+tag.bg+';color:'+tag.color+';border-color:'+tag.color+'">'+(projet.secteur||'Projet')+'</span>' +
    '</div>' +
    '<div class="pcard-title">'+projet.titre+'</div>' +
    '<div class="pcard-desc">'+(projet.pitch_court||'')+'</div>' +
    '<div class="pcard-chips">'+chips+'</div>' +
    '<div class="pcard-footer">' +
      '<div class="pcard-meta">' +
        '<div class="pcard-loc">' +
          '<svg width="11" height="11" viewBox="0 0 11 11" fill="none"><circle cx="5.5" cy="4.5" r="2" stroke="currentColor" stroke-width="1.2"/><path d="M5.5 1C3.57 1 2 2.57 2 4.5c0 2.72 3.5 5.5 3.5 5.5S9 7.22 9 4.5C9 2.57 7.43 1 5.5 1z" stroke="currentColor" stroke-width="1.2"/></svg> ' +
          (projet.ville||'') +
        '</div>' +
        '<span class="pcard-stage">'+(projet.stade||'')+'</span>' +
      '</div>' +
      '<a href="/deposer.html?edit='+projet.id+'" class="btn-edit">Modifier &rarr;</a>' +
    '</div>' +
  '</div>';
}

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    window.location.href = '/auth.html?redirect=/mes-projets.html';
    return;
  }

  try {
    const res = await fetch('/api/projets/me', {
      headers: { 'Authorization': 'Bearer ' + session.access_token }
    });
    if (!res.ok) throw new Error();
    const projets = await res.json();

    document.getElementById('countProjets').textContent = projets.length;

    const grid = document.getElementById('cardsGrid');
    if (projets.length === 0) {
      grid.innerHTML =
        '<div class="empty">' +
          '<div class="empty-icon">&#128204;</div>' +
          '<div class="empty-title">Tu n\'as pas encore d\u00e9pos\u00e9 de projet</div>' +
          '<div class="empty-sub">Publie ton projet et trouve ton futur associ\u00e9 en quelques clics.</div>' +
          '<a href="/deposer.html" class="empty-cta">D\u00e9poser mon premier projet &rarr;</a>' +
        '</div>';
    } else {
      grid.innerHTML = projets.map(function(p, i) { return buildCard(p, i); }).join('');
    }
  } catch(err) {
    document.getElementById('cardsGrid').innerHTML = '<div class="empty"><div class="empty-title">Erreur de chargement</div></div>';
  }
}

init();
</script>
<script src="/nav.js"></script>
</body>
</html>
