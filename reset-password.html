<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe — Trouver un Associé</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --c-red:#E11D2E;--c-red-deep:#C0142A;
  --c-navy:#1A1247;--c-navy-ink:#0E0830;
  --c-blue:#1F60E8;--c-blue-soft:#E6EEFC;
  --c-bg:#FBFAF7;--c-mute:#7A7A8E;
  --c-white:#FFFFFF;--c-border:rgba(14,8,48,.08);
  --f-display:'Sora',sans-serif;--f-body:'Inter',sans-serif;
  --radius:22px;
}
body{font-family:var(--f-body);background:var(--c-bg);color:var(--c-navy-ink);line-height:1.6;font-size:15px;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}

/* UTIL BAR */
.util-bar{background:var(--c-navy);padding:10px 24px;display:flex;align-items:center;justify-content:center;gap:12px}
.util-bar span{font-family:var(--f-body);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:0.16em;color:var(--c-white)}
.util-bar .ub-sep{font-size:10px;color:rgba(255,255,255,.3)}
.util-bar .ub-link{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--c-white);text-decoration:none;letter-spacing:0.1em;opacity:.85;transition:opacity .2s}
.util-bar .ub-link:hover{opacity:1;text-decoration:underline}

/* NAV */
nav{background:var(--c-white);border-bottom:1.5px solid var(--c-border);padding:0 5%;display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{text-decoration:none;display:flex;align-items:center;gap:10px}
.logo-bubble{width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.logo-text{display:flex;flex-direction:column;line-height:1.15}
.logo-name{font-family:var(--f-display);font-weight:400;font-size:15px;color:var(--c-navy-ink)}
.logo-sub{font-family:var(--f-body);font-weight:500;font-size:9.5px;color:var(--c-mute);text-transform:uppercase;letter-spacing:0.04em}
.back-link{font-family:var(--f-body);font-size:14px;font-weight:500;color:var(--c-mute);text-decoration:none;display:flex;align-items:center;gap:6px;transition:color .2s}
.back-link:hover{color:var(--c-navy-ink)}

/* CENTERED CARD */
.page{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}
.card{background:var(--c-white);border-radius:var(--radius);padding:48px 40px;width:100%;max-width:440px;box-shadow:0 2px 12px rgba(14,8,48,.06)}

/* FORM */
.card-title{font-family:var(--f-display);font-weight:300;font-size:24px;color:var(--c-navy-ink);letter-spacing:-0.012em;margin-bottom:6px}
.card-sub{font-family:var(--f-body);font-size:14px;color:var(--c-mute);margin-bottom:28px;line-height:1.5}
.field{margin-bottom:18px}
.field label{display:block;font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--c-navy-ink);margin-bottom:7px}
.field input{width:100%;padding:12px 16px;border:1.5px solid var(--c-border);border-radius:10px;font-family:var(--f-body);font-size:14px;color:var(--c-navy-ink);background:var(--c-white);outline:none;transition:border-color .2s,box-shadow .2s}
.field input:focus{border-color:var(--c-red);box-shadow:0 0 0 3px rgba(225,29,46,.08)}
.field-hint{font-family:var(--f-body);font-size:12px;color:var(--c-mute);margin-top:5px}
.btn-auth{width:100%;padding:14px;border-radius:999px;background:var(--c-red);color:white;font-family:var(--f-body);font-size:15px;font-weight:600;border:none;cursor:pointer;transition:all .2s;margin-top:8px}
.btn-auth:hover{background:var(--c-red-deep);transform:translateY(-1px)}
.btn-auth:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* BANNERS */
.error-banner{background:rgba(225,29,46,.06);border:1.5px solid rgba(225,29,46,.2);border-radius:10px;padding:12px 16px;font-family:var(--f-body);font-size:13px;color:var(--c-red-deep);margin-bottom:16px;display:none}
.error-banner.show{display:block}
.success-banner{background:var(--c-blue-soft);border:1.5px solid rgba(31,96,232,.2);border-radius:10px;padding:12px 16px;font-family:var(--f-body);font-size:13px;color:var(--c-blue);margin-bottom:16px;display:none}
.success-banner.show{display:block}

@media(max-width:760px){
  .card{padding:32px 24px}
}
</style>
</head>
<body>

<div class="util-bar">
  <span>French Tech Bordeaux</span>
  <span class="ub-sep">&middot;</span>
  <a href="https://www.frenchtechbordeaux.com/adhesion" target="_blank" rel="noopener" class="ub-link">Adh&eacute;rer &rarr;</a>
</div>

<nav>
  <a href="index.html" class="logo">
    <div class="logo-bubble">
      <svg width="36" height="36" viewBox="0 0 80 80" fill="none"><rect width="80" height="80" rx="20" fill="#0E0830"/><circle cx="28" cy="32" r="9" fill="#E11D2E"/><circle cx="52" cy="32" r="9" fill="#1F60E8"/><path d="M18 56C18 50 22 46 28 46C32 46 35 48.5 40 48.5C45 48.5 48 46 52 46C58 46 62 50 62 56" stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none"/><path d="M37 56H43" stroke="#E11D2E" stroke-width="3.5" stroke-linecap="round"/></svg>
    </div>
    <div class="logo-text">
      <span class="logo-name">trouver un associé</span>
      <span class="logo-sub">BY FRENCH TECH BORDEAUX</span>
    </div>
  </a>
  <a href="index.html" class="back-link">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Retour à l'accueil
  </a>
</nav>

<div class="page">
  <div class="card">
    <div class="error-banner" id="errorBanner"></div>
    <div class="success-banner" id="successBanner"></div>

    <div id="resetForm">
      <div class="card-title">Définir un nouveau mot de passe</div>
      <div class="card-sub">Choisis un nouveau mot de passe pour ton compte.</div>
      <div class="field">
        <label for="newPassword">Nouveau mot de passe</label>
        <input type="password" id="newPassword" placeholder="••••••••">
        <div class="field-hint">Minimum 6 caractères</div>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input type="password" id="confirmPassword" placeholder="••••••••">
      </div>
      <button class="btn-auth" id="btnReset" onclick="handleReset()">Valider</button>
    </div>
  </div>
</div>

<script>
(function() {
  const { createClient } = supabase;
  const sb = createClient(
    'https://rdyrlculowoqtixgdumc.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkeXJsY3Vsb3dvcXRpeGdkdW1jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3Njc3OTcsImV4cCI6MjA5MTM0Mzc5N30.RANwu2ouv0cn3G-UXxaxgEWD_GZFw7apogJg35vb_qo'
  );

  function showError(msg) {
    var b = document.getElementById('errorBanner');
    b.textContent = msg;
    b.classList.add('show');
    document.getElementById('successBanner').classList.remove('show');
  }

  function showSuccess(msg) {
    var b = document.getElementById('successBanner');
    b.textContent = msg;
    b.classList.add('show');
    document.getElementById('errorBanner').classList.remove('show');
  }

  window.handleReset = async function() {
    var password = document.getElementById('newPassword').value;
    var confirm = document.getElementById('confirmPassword').value;
    var btn = document.getElementById('btnReset');

    if (!password || !confirm) return showError('Remplis les deux champs.');
    if (password.length < 6) return showError('Le mot de passe doit faire au moins 6 caractères.');
    if (password !== confirm) return showError('Les mots de passe ne correspondent pas.');

    btn.disabled = true;
    btn.textContent = 'Mise à jour…';

    var { error } = await sb.auth.updateUser({ password: password });

    if (error) {
      showError(error.message);
      btn.disabled = false;
      btn.textContent = 'Valider';
      return;
    }

    showSuccess('Mot de passe mis à jour ! Redirection…');
    document.getElementById('resetForm').style.display = 'none';
    setTimeout(function() { window.location.href = '/'; }, 2000);
  };
})();
</script>
</body>
</html>
